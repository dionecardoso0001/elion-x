# CI do ELION-X — roda em todo push e pull request.
#
# Decisões:
# · Ações fixadas por SHA de COMMIT (não por tag): tag é mutável e já foi vetor
#   de ataque de cadeia de suprimentos (tj-actions/changed-files, mar/2025).
#   Para atualizar: `git ls-remote --tags https://github.com/actions/<ação>`.
# · `npm ci --ignore-scripts`: nenhum script de instalação de terceiro roda na
#   CI (o puppeteer do whatsapp-web.js baixaria um Chrome inteiro à toa).
# · Matriz: Node 20 = mínimo declarado em package.json "engines" (já fora de
#   suporte, mantido enquanto o mínimo for 20); 22; e a LTS vigente. Windows
#   entra porque é onde a plataforma roda de fato (estaticos.mjs trata NTFS).
# · Auditoria de dependências é INFORMATIVA: as vulnerabilidades conhecidas são
#   transitivas do whatsapp-web.js/puppeteer, sem correção sem trocar a
#   integração (ver docs/SENTINELA.md). Fica visível no resumo, não bloqueia.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', 'lts/*']
        include:
          - os: windows-latest
            node: 'lts/*'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências (lockfile exato, sem scripts de terceiros)
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Sintaxe de todo JavaScript versionado (fora de assets/vendor)
        run: |
          lista="$RUNNER_TEMP/arquivos-js.txt"
          git ls-files '*.js' '*.mjs' '*.cjs' | grep -v '^assets/vendor/' > "$lista"
          echo "verificando $(wc -l < "$lista") arquivos"
          falhas=0
          while IFS= read -r arq; do node --check "$arq" || { echo "::error file=$arq::sintaxe inválida"; falhas=$((falhas+1)); }; done < "$lista"
          test "$falhas" -eq 0

      - name: Testes (node:test)
        run: npm test

  auditoria:
    name: auditoria de dependências (informativa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: npm audit (produção)
        continue-on-error: true
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node -e '
            const j = require(process.env.RUNNER_TEMP + "/audit.json");
            if (!j.metadata) { console.log("::warning::npm audit não produziu relatório"); process.exit(1); }
            const a = j.metadata.vulnerabilities || {};
            const linha = ["critical", "high", "moderate", "low"].map(n => `${n}: ${a[n] ?? 0}`).join(" · ");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### npm audit (produção)\n${linha}\n`);
            console.log(linha);
            if ((a.critical ?? 0) + (a.high ?? 0) > 0) { console.log("::warning::há vulnerabilidades altas/críticas — ver docs/SENTINELA.md"); process.exit(1); }
          '

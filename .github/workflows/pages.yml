# Publica o SENTINELA SPY no GitHub Pages deste repositório:
#   https://dionecardoso0001.github.io/elion-x/sentinela-spy/
# (a raiz https://dionecardoso0001.github.io/elion-x/ leva até ele)
#
# Pré-requisito, UMA vez: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Roda a cada push na main que mexa no sentinela-spy/ e também sob demanda (Actions → Run workflow).
#
# O ELION-X em si NÃO vai para o Pages: ele precisa do servidor Node (voz, e-mail,
# WhatsApp) e de segredos locais. O Sentinela Spy funciona em hospedagem estática:
# a percepção roda no navegador e o agente usa a chave do próprio operador.
name: Publicar Sentinela Spy no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sentinela-spy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sentinela-spy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: sentinela-spy/package-lock.json
      - name: Instalar dependências (lockfile exato, sem scripts de terceiros)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testes
        run: npm test
      - name: Runtime de visão, SDK oficial e modelos (SHA-256 conferido)
        run: npm run preparar
      - name: Build estático
        run: npm run build
      - name: Montar o site
        working-directory: .
        run: |
          mkdir -p _site
          cp -r sentinela-spy/dist _site/sentinela-spy
          cp sentinela-spy/pages-raiz.html _site/index.html
          touch _site/.nojekyll
          echo "### Site montado" >> "$GITHUB_STEP_SUMMARY"
          echo "$(find _site -type f | wc -l) arquivos, $(du -sh _site | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}sentinela-spy/
    steps:
      - id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# CI do Sentinela Spy — todo push e pull request.
# Ações fixadas por SHA de COMMIT (tag é mutável; conferido com git ls-remote).
# `npm ci --ignore-scripts`: nenhum script de instalação de terceiro roda.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', 'lts/*']
        include:
          - os: windows-latest
            node: 'lts/*'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependências (lockfile exato, sem scripts de terceiros)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sintaxe de todo JavaScript versionado
        run: |
          falhas=0
          while IFS= read -r arq; do node --check "$arq" || { echo "::error file=$arq::sintaxe inválida"; falhas=$((falhas+1)); }; done < <(git ls-files '*.js' '*.mjs' '*.cjs')
          test "$falhas" -eq 0
      - name: Testes (node:test)
        run: npm test
      - name: Preparação e build estático (runtime + SDK, sem baixar modelos)
        run: npm run preparar -- --sem-modelos && npm run build

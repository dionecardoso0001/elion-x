<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Painel do estúdio — Advanced Tech TI</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Sora:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/studio.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/admin.js" defer></script>
</head>
<body>
<header class="header">
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/logo-head.webp" alt="" width="38" height="48"><span><b>ADVANCED TECH TI</b><small>Painel do estúdio</small></span></a>
    <button class="btn btn-sm" type="button" id="logout" hidden>Sair</button>
  </div>
</header>
<main class="order-shell">
  <div class="wrap">
    <form class="card toolbar" id="login">
      <div class="field m0 grow"><label for="tok">Token de administrador</label><input id="tok" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>

    <section id="panel" hidden>
      <div class="kpis" id="kpis" aria-live="polite"></div>
      <div class="filters" role="group" aria-label="Filtrar pedidos" id="filters"></div>
      <p class="form-error" id="err" role="alert"></p>
      <div id="orders" class="admin-list"></div>
    </section>
  </div>
</main>
</body>
</html>
